services:
  - type: web
    name: ale-animiec-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
    # Uwaga: trwałe dyski wymagają płatnego planu. Na planie `free` ta sekcja
    # zostanie odrzucona przy walidacji blueprintu – usuń ją albo zmień `plan`.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
