services:
  - type: web
    name: ale-animiec-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

# Uwaga: trwałe dyski są dostępne tylko na płatnych planach i blueprint z sekcją
# `disk:` przy `plan: free` nie przechodzi walidacji. Na free tierze katalog
# uploads/ i tak jest efemeryczny — znika przy każdym restarcie i deployu.
#
# Po przejściu na plan płatny dopisz z powrotem:
#
#    disk:
#      name: uploads
#      mountPath: /opt/render/project/src/uploads
#      sizeGB: 1
