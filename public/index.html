<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aleAnimiec – Oglądaj</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
  <img src="/logo.png" alt="Logo" class="header-logo" />
  <h1>ale<span>Animiec</span> <span style="font-weight:300;font-size:1rem">— oglądaj</span></h1>
  <div style="display:flex;gap:.75rem;align-items:center">
    <div class="badge">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">Łączenie…</span>
    </div>
    <div class="badge" id="viewers-badge" title="Połączeni z pokojem">
      👁 <span id="viewers-count">0</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="video-wrap mt-2" id="video-wrap">
    <video id="player" preload="auto"></video>
    <div id="embed-player" class="hidden"></div>
    <div class="video-placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 2l16 10L4 22V2z"/>
      </svg>
      <span>Czekaj na film od admina…</span>
    </div>
    <div class="subtitle-layer hidden" id="subtitle-layer"></div>
    <div class="embed-fallback hidden" id="embed-fallback">
      <span>Nie widzisz obrazu? Ten serwis blokuje osadzanie.</span>
      <a id="embed-fallback-link" href="#" target="_blank" rel="noopener noreferrer">Otwórz w nowej karcie ↗</a>
    </div>
    <button type="button" class="tap-overlay hidden" id="tap-overlay">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/>
      </svg>
      <span>Kliknij, aby oglądać z dźwiękiem</span>
      <small>Przeglądarka blokuje automatyczne odtwarzanie z dźwiękiem</small>
    </button>
    <div class="video-controls" id="video-controls">
      <div class="volume-control">
        <button class="btn-volume" id="btn-mute" title="Wycisz/Włącz dźwięk">
          <svg id="vol-icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/>
          </svg>
          <svg id="vol-icon-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" />
      </div>
      <button class="btn-fullscreen btn-cc hidden" id="btn-cc" title="Napisy włącz/wyłącz" aria-pressed="true">CC</button>
      <button class="btn-fullscreen" id="btn-fullscreen" title="Pełny ekran">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
      </button>
    </div>
  </div>


  <div class="status-strip mt-1" id="status-strip">
    <span class="dot" id="sync-dot"></span>
    <span id="sync-label">Brak synchronizacji</span>
  </div>

  <!-- Timer bar -->
  <div class="timer-bar mt-2" id="timer-bar">
    <div class="timer-bar__time">
      <span id="timer-current">00:00.000</span>
      <span class="timer-bar__sep">/</span>
      <span id="timer-duration">00:00.000</span>
    </div>
    <div class="timer-bar__drift">
      Dryft: <span id="timer-drift">0</span> ms
    </div>
    <button class="btn btn-ghost btn-sm" id="btn-resync">⟳ Synchronizuj</button>
  </div>
</div>

<!-- sync pill (top-right) -->
<div id="sync-indicator">
  <span class="dot" id="pill-dot"></span>
  <span id="pill-label">—</span>
</div>

<script src="/config.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="/subtitles.js"></script>
<script>
  // The socket.io client lives on the backend, usually a different origin.
  // Pulling it in with document.write makes it a parser-blocking cross-site
  // script, which Chrome may refuse to fetch on a slow connection – and a
  // Render free-tier cold start looks exactly like one. Load it explicitly and
  // start the app once it either arrived or failed; the app itself reports a
  // missing server.
  (function () {
    var loader = document.createElement('script');
    loader.src = (window.BACKEND_URL || '') + '/socket.io/socket.io.js';
    loader.onload = start;
    loader.onerror = start;
    document.head.appendChild(loader);

    function start() {
      var app = document.createElement('script');
      app.src = '/viewer.js';
      document.head.appendChild(app);
    }
  }());
</script>
</body>
</html>
